# render.yaml — Render Blueprint
# Defines the Celestal Eye web service and its managed PostgreSQL database.
# Deploy by connecting this repo to Render and choosing "Blueprint".

services:
  - type: web
    name: celestal-eye-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: celestal-eye-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: celestal-eye-db
    plan: free
    databaseName: celestal_eye
    user: celestal
