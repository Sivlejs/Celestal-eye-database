# render.yaml — Render Blueprint
# Defines the Celestal Eye web service and its managed PostgreSQL database.
# Deploy by connecting this repo to Render and choosing "Blueprint".

services:
  - type: web
    name: celestal-eye-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: celestal-eye-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secure random value
      - key: ALLOWED_ORIGINS
        value: ""                    # Set to your app's URL after first deploy,
                                     # e.g. https://celestal-eye.app

databases:
  - name: celestal-eye-db
    plan: free
    databaseName: celestal_eye
    user: celestal
