version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: celestal_eye_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-celestal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celestal_secret}
      POSTGRES_DB: ${POSTGRES_DB:-celestal_eye}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-celestal} -d ${POSTGRES_DB:-celestal_eye}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: celestal_eye_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-celestal}:${POSTGRES_PASSWORD:-celestal_secret}@postgres:5432/${POSTGRES_DB:-celestal_eye}
    ports:
      - "${PORT:-3000}:3000"

  adminer:
    image: adminer:4
    container_name: celestal_eye_adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
